name: "Update Script (reusable)"

# Reusable workflow - does the actual data refresh work. Not triggered
# directly; called from check-commit.yml (manual/PR path) and
# scheduled-update.yml (automatic path) via `jobs.<id>.uses:`.
#
# Responsibilities:
#   1. Work out which datasets to refresh for the given update-type.
#   2. Run the corresponding data-raw/ update scripts.
#   3. Commit + push the regenerated data objects back onto the working
#      branch (the PR branch for manual runs, the bot branch for automatic
#      runs) so check-data.yml validates the real diff.
#
# TODO(SRJPE): the Rscript paths under "Run dataset update scripts" are
# placeholders (data-raw/update_adult.R etc.) - point these at the real
# script names/paths once confirmed. Same for the dependency-install step,
# which assumes a standard DESCRIPTION-driven R package; swap in
# renv::restore() if this repo pins deps with renv instead.

on:
  workflow_call:
    inputs:
      update_type:
        description: "annual | biweekly | manual"
        required: true
        type: string
      datasets:
        description: >
          Comma-separated list of datasets to refresh (adult, temperature,
          juvenile, flow). Leave blank to use the default mapping for
          update_type (annual -> adult,temperature; biweekly -> juvenile,flow).
        required: false
        type: string
        default: ""
      ref:
        description: "Branch to check out and push the regenerated data to."
        required: true
        type: string
      commit_changes:
        description: "Whether to commit + push regenerated data objects."
        required: false
        type: boolean
        default: true
    outputs:
      data_changed:
        description: "'true' if any data objects were regenerated with differences."
        value: ${{ jobs.update-data.outputs.data_changed }}
      datasets_run:
        description: "Resolved, comma-separated list of datasets that were refreshed."
        value: ${{ jobs.update-data.outputs.datasets_run }}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.diff.outputs.data_changed }}
      datasets_run: ${{ steps.resolve-datasets.outputs.datasets_run }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve dataset list for update_type=${{ inputs.update_type }}
        id: resolve-datasets
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.datasets }}" ]; then
            datasets="${{ inputs.datasets }}"
          else
            case "${{ inputs.update_type }}" in
              annual)   datasets="adult,temperature" ;;
              biweekly) datasets="juvenile,flow" ;;
              manual)   datasets="adult,temperature,juvenile,flow" ;; # TODO(SRJPE): confirm default scope for ad-hoc manual runs
              *)
                echo "::error::Unrecognized update_type '${{ inputs.update_type }}'"
                exit 1
                ;;
            esac
          fi
          echo "Resolved datasets: ${datasets}"
          echo "datasets_run=${datasets}" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
          # TODO(SRJPE): replace with renv::restore() here if this repo
          # uses renv for dependency locking instead of DESCRIPTION deps.

      - name: Run dataset update scripts
        env:
          # TODO(SRJPE): wire up whatever secrets the data-raw scripts need
          # to reach EDI and the Azure SRJPE database (connection string,
          # API keys, etc.) - referenced here as placeholders.
          AZURE_SRJPE_DB_CONNECTION_STRING: ${{ secrets.AZURE_SRJPE_DB_CONNECTION_STRING }}
          EDI_API_TOKEN: ${{ secrets.EDI_API_TOKEN }}
        run: |
          set -euo pipefail
          IFS=',' read -ra DATASETS <<< "${{ steps.resolve-datasets.outputs.datasets_run }}"
          for dataset in "${DATASETS[@]}"; do
            script="data-raw/update_${dataset}.R"
            if [ ! -f "${script}" ]; then
              echo "::error::Expected update script not found: ${script} (TODO: fix path/name mapping)"
              exit 1
            fi
            echo "::group::Running ${script}"
            Rscript "${script}"
            echo "::endgroup::"
          done

      - name: Regenerate package documentation
        run: Rscript -e 'devtools::document()'

      - name: Check for data changes
        id: diff
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git status --porcelain
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes produced by this run."
          fi

      - name: Commit + push regenerated data
        if: ${{ inputs.commit_changes && steps.diff.outputs.data_changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "srjpe-data-bot"
          git config user.email "srjpe-data-bot@users.noreply.github.com"
          git add data/ man/ NAMESPACE
          git commit -m "chore(data): ${{ inputs.update_type }} update for ${{ steps.resolve-datasets.outputs.datasets_run }}" \
                      -m "Update-Type: ${{ inputs.update_type }}"
          git push origin "HEAD:${{ inputs.ref }}"
