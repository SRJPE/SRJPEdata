name: "Update Script (reusable)"

# Reusable workflow - runs data-raw/update_data.R, the single script that
# pulls raw monitoring data (RST catch/trap/efficiency, flow, temperature,
# genetics, survival, and - in January - adult) from jpe-db, the DataTackle
# pilot database, EDI, and CDEC/USGS gages, then rebuilds every package data
# object. Called from check-commit.yml (manual/PR path) and
# scheduled-update.yml (automatic path) via `jobs.<id>.uses:`.
#
# There is no such thing as "run the adult script" vs "run the flow script" -
# update_data.R always runs top to bottom in one pass. What changes between
# update types is (a) whether adult-only sections run at all, and (b) what's
# actually available to pull that day - not which script executes.
#
# QC (run_annual_qc.R) and the stream-team review renders (render_reviews.R)
# now run HERE, right after update_data.R and before the commit below, so
# the data objects AND the QC/review outputs they depend on land in one
# single commit. That commit is what triggers test-data.yml (via its
# `pull_request` path filter) to run fresh against the fully-updated
# branch - test-data.yml no longer regenerates anything itself; it just
# compares this branch's committed .rda files and qc_log_errors.csv against
# main and runs tests/checks. (Previously QC/review ran inside test-data.yml
# instead, as a gate that only ran once test-data.yml itself fired - moved
# here so "commit everything, then diff against the other branch" is a
# clean two-step pipeline instead of test-data.yml generating and comparing
# in the same run.)
#
# IMPORTANT - update_data.R currently decides whether to pull adult data /
# build the stock-recruit datasets with `if (month(Sys.Date()) == 1)`, a
# wall-clock check - NOT the update_type resolved below. update_type is
# exposed to the R process as the UPDATE_TYPE env var, but until that
# hardcoded month check in update_data.R is changed to read it, triggering
# update_type=annual by hand in, say, June will NOT pull adult data - only
# an actual January run will. This is the exact "TODO: transition to
# alert_type" the whole automation project started from, but changing
# update_data.R's own pull logic is a behavior change to a script you own,
# not a workflow-file change, so it's deliberately left alone here pending
# an explicit go-ahead.

on:
  workflow_call:
    inputs:
      update_type:
        description: "annual | biweekly | manual"
        required: true
        type: string
      ref:
        description: "Branch to check out and push the regenerated data to."
        required: true
        type: string
      commit_changes:
        description: "Whether to commit + push regenerated data objects."
        required: false
        type: boolean
        default: true
    outputs:
      data_changed:
        description: "'true' if update_data.R produced any file changes."
        value: ${{ jobs.update-data.outputs.data_changed }}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.diff.outputs.data_changed }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package + all Imports/Suggests/Remotes from DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::DBI
            any::RPostgres
            any::EDIutils
            any::RMark
            any::data.table
            any::leaflet
            any::readr
            any::pkgdown
            any::quarto
            any::glue
            any::DT

      - name: Check DB env vars are set
        env:
          jpe_db_user_id: ${{ secrets.JPE_DB_USER_ID }}
          jpe_db_password: ${{ secrets.JPE_DB_PASSWORD }}
        run: |
          echo "user length: ${#jpe_db_user_id}"
          echo "password length: ${#jpe_db_password}"

      - name: Run data-raw/update_data.R
        env:
          UPDATE_TYPE: ${{ inputs.update_type }}
          # See data-raw/pull_data_scripts/pull_tables_from_database.R,
          # pull_tables_from_data_tackle_database.R, and
          # pull_functional_flows.R for exactly how these five are read -
          # names below (left side) are case-sensitive and must match those
          # Sys.getenv() calls exactly.
          jpe_db_user_id: ${{ secrets.JPE_DB_USER_ID }}
          jpe_db_password: ${{ secrets.JPE_DB_PASSWORD }}
          pilot_db_user_id: ${{ secrets.PILOT_DB_USER_ID }}
          pilot_db_password: ${{ secrets.PILOT_DB_PASSWORD }}
          EFLOWS_TOKEN: ${{ secrets.EFLOWS_TOKEN }}
          EDI_API_KEY: ${{ secrets.EDI_API_KEY }}
        run: Rscript data-raw/update_data.R

      # ==========================================
      # ANNUAL QC + STREAM TEAM REVIEW
      # ==========================================
      # Renders data-raw/qc/run_annual_qc.R (appends any newly-detected
      # issues to data-raw/qc/qc_log_errors.csv / qc_log_warnings.csv) and
      # data-raw/data-checks/stream_team_review/render_reviews.R (the
      # per-stream reports emailed to stream teams), right after the data
      # pull so their outputs get committed together with the data below.
      #
      # Skipped for biweekly runs: run_annual_qc.R's own header says "run
      # this once per year after the RST season ends," and the stream team
      # reports are described in the README as emailed once a year
      # (July-September) - rendering nine Rmd/qmd reports on every
      # biweekly sync would run against that intent. If that's wrong and
      # you actually want these on every run, drop the `if:` below.
      #
      # continue-on-error so a rendering hiccup here doesn't block the data
      # commit itself; test-data.yml's comparison against main is what
      # actually surfaces new QC issues and gates the PR.
      - name: Run annual QC + stream team review
        if: ${{ inputs.update_type != 'biweekly' }}
        continue-on-error: true
        run: |
          Rscript -e '
            devtools::load_all(quiet = TRUE)
            source("data-raw/data-checks/stream_team_review/render_reviews.R")
            source("data-raw/qc/run_annual_qc.R")
          '

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected (data + QC/review outputs):"
            git status --porcelain
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced by this run."
          fi

      - name: Commit + push regenerated data + QC/review outputs
        if: ${{ inputs.commit_changes && steps.diff.outputs.data_changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "srjpe-data-bot"
          git config user.email "srjpe-data-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): ${{ inputs.update_type }} update" \
                      -m "Includes regenerated data objects and, unless biweekly, rendered annual QC + stream team review outputs." \
                      -m "Update-Type: ${{ inputs.update_type }}"
          git push origin "HEAD:${{ inputs.ref }}"
