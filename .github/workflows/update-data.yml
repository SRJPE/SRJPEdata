name: "Update Script (reusable)"
 
# Reusable workflow - runs data-raw/update_data.R, the single script that
# pulls raw monitoring data (RST catch/trap/efficiency, flow, temperature,
# genetics, survival, and - in January - adult) from jpe-db, the DataTackle
# pilot database, EDI, and CDEC/USGS gages, then rebuilds every package data
# object. Called from check-commit.yml (manual/PR path) and
# scheduled-update.yml (automatic path) via `jobs.<id>.uses:`.
#
# There is no such thing as "run the adult script" vs "run the flow script" -
# update_data.R always runs top to bottom in one pass. What changes between
# update types is (a) whether adult-only sections run at all, and (b) what's
# actually available to pull that day - not which script executes.
#
# QC (run_annual_qc.R) and the stream-team review renders (render_reviews.R)
# used to run automatically at the tail of update_data.R itself - that call
# has been commented out there (see data-raw/update_data.R) and moved to
# test-data.yml instead, so they run exactly once, as an explicit gate
# against the data this step just produced, rather than unconditionally
# inside this step every time regardless of what test-data.yml then does.
#
# IMPORTANT - update_data.R currently decides whether to pull adult data /
# build the stock-recruit datasets with `if (month(Sys.Date()) == 1)`, a
# wall-clock check - NOT the update_type resolved below. update_type is
# exposed to the R process as the UPDATE_TYPE env var, but until that
# hardcoded month check in update_data.R is changed to read it, triggering
# update_type=annual by hand in, say, June will NOT pull adult data - only
# an actual January run will. This is the exact "TODO: transition to
# alert_type" the whole automation project started from, but changing
# update_data.R's own pull logic is a behavior change to a script you own,
# not a workflow-file change, so it's deliberately left alone here pending
# an explicit go-ahead.

on:
  workflow_call:
    inputs:
      update_type:
        description: "annual | biweekly | manual"
        required: true
        type: string
      ref:
        description: "Branch to check out and push the regenerated data to."
        required: true
        type: string
      commit_changes:
        description: "Whether to commit + push regenerated data objects."
        required: false
        type: boolean
        default: true
    outputs:
      data_changed:
        description: "'true' if update_data.R produced any file changes."
        value: ${{ jobs.update-data.outputs.data_changed }}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.diff.outputs.data_changed }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package + all Imports/Suggests/Remotes from DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::DBI
            any::RPostgres

      - name: Run data-raw/update_data.R
        env:
          UPDATE_TYPE: ${{ inputs.update_type }}
          # See data-raw/pull_data_scripts/pull_tables_from_database.R,
          # pull_tables_from_data_tackle_database.R, and
          # pull_functional_flows.R for exactly how these five are read -
          # names below (left side) are case-sensitive and must match those
          # Sys.getenv() calls exactly.
          jpe_db_user_id: ${{ secrets.JPE_DB_USER_ID }}
          jpe_db_password: ${{ secrets.JPE_DB_PASSWORD }}
          pilot_db_user_id: ${{ secrets.PILOT_DB_USER_ID }}
          pilot_db_password: ${{ secrets.PILOT_DB_PASSWORD }}
          EFLOWS_TOKEN: ${{ secrets.EFLOWS_TOKEN }}
        run: Rscript data-raw/update_data.R

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git status --porcelain
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced by this run."
          fi

      - name: Commit + push regenerated data
        if: ${{ inputs.commit_changes && steps.diff.outputs.data_changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "srjpe-data-bot"
          git config user.email "srjpe-data-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): ${{ inputs.update_type }} update" -m "Update-Type: ${{ inputs.update_type }}"
          git push origin "HEAD:${{ inputs.ref }}"
