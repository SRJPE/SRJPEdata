name: Data Quality and Package Checks

# Runs purely as a check against what's already been committed to this PR
# branch - it does NOT regenerate data or run QC/stream-team-review itself.
# update-data.yml does that (data pull + QC/review render + one commit),
# and that push is what triggers this workflow (via the `paths:` filter
# below) to run fresh against the fully-updated branch. This job then just
# compares that committed state to main (.rda files via
# inst/scripts/compare_data_files.R, and data-raw/qc/qc_log_errors.csv via
# the "Compare QC log against main" step) plus runs tests/credential/
# structure checks.

on:
  pull_request:
    # TODO(SRJPE): test-github-actions is here temporarily so Erin can test
    # this workflow chain by opening a PR from testing_workflow into
    # test-github-actions - remove it once that testing is done, leaving
    # only main.
    branches:
      - main
      - test-github-actions
    paths:
      - 'data/*.rda'
      - 'data/*.RData'
      - 'R/**'
      - 'tests/**'
      - 'inst/**'
      - 'data-raw/qc/qc_log_errors.csv'
      - 'data-raw/qc/qc_log_warnings.csv'
      - 'data-raw/qc/reports/**'
      - 'data-raw/data-checks/stream_team_review/stream_team_reports/**'

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch main branch
        run: |
          git fetch origin main:main
          echo "Current branch: $(git branch --show-current)"

      - name: Resolve update-type from the last commit
        id: update-type
        run: |
          body="$(git log -1 --format=%B HEAD)"
          if echo "$body" | grep -qiE '^update-type:[[:space:]]*annual[[:space:]]*$'; then
            update_type="annual"
          elif echo "$body" | grep -qiE '^update-type:[[:space:]]*biweekly[[:space:]]*$'; then
            update_type="biweekly"
          else
            update_type="manual"
          fi
          echo "Resolved update_type=${update_type}"
          echo "update_type=${update_type}" >> "$GITHUB_OUTPUT"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install package + all Imports/Suggests/Remotes from DESCRIPTION
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::yaml
            any::remotes
            any::roxygen2

      # ==========================================
      # CREDENTIAL SCANNING
      # ==========================================

      - name: Check for credentials and sensitive files
        id: credential-check
        run: |
          echo "=== Checking for credentials and sensitive files ==="
          FOUND_ISSUES=0

          FORBIDDEN_FILES=(
            ".Renviron"
            ".env"
            ".httr-oauth"
            ".secrets"
            "credentials.R"
            "config.yml"
          )

          FORBIDDEN_PATTERNS=(
            "password\\s*=\\s*['\"][^'\"]{3,}['\"]"
            "api[_-]?key\\s*=\\s*['\"][^'\"]{10,}['\"]"
            "secret\\s*=\\s*['\"][^'\"]{10,}['\"]"
            "token\\s*=\\s*['\"][^'\"]{10,}['\"]"
            "aws_access_key_id"
            "aws_secret_access_key"
          )

          echo "Checking for forbidden files..."
          for file in "${FORBIDDEN_FILES[@]}"; do
            if git ls-files | grep -q "^${file}$"; then
              echo "❌ ERROR: Found forbidden file: $file"
              FOUND_ISSUES=$((FOUND_ISSUES + 1))
            fi
          done

          echo ""
          echo "Checking for credential patterns in code..."
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            matches=$(git grep -i -E "$pattern" -- '*.R' '*.r' '*.Rmd' '*.rmd' 2>/dev/null || true)
            if [ ! -z "$matches" ]; then
              echo "⚠️  WARNING: Found potential credential pattern:"
              echo "$matches"
              FOUND_ISSUES=$((FOUND_ISSUES + 1))
            fi
          done

          echo ""
          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "✅ No credentials or sensitive files found"
          else
            echo "❌ Found $FOUND_ISSUES potential issues"
          fi

          echo "credential_issues=$FOUND_ISSUES" >> $GITHUB_OUTPUT

      # ==========================================
      # R PACKAGE STRUCTURE CHECK
      # ==========================================

      - name: Check R package structure
        id: structure-check
        run: |
          echo "=== Checking R package structure ==="
          STRUCTURE_ISSUES=0

          REQUIRED_FILES=(
            "DESCRIPTION"
            "NAMESPACE"
          )

          REQUIRED_DIRS=(
            "R"
            "man"
          )

          echo "Checking required files..."
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Missing required file: $file"
              STRUCTURE_ISSUES=$((STRUCTURE_ISSUES + 1))
            else
              echo "✓ Found: $file"
            fi
          done

          echo ""
          echo "Checking required directories..."
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Missing required directory: $dir/"
              STRUCTURE_ISSUES=$((STRUCTURE_ISSUES + 1))
            else
              echo "✓ Found: $dir/"
            fi
          done

          echo ""
          echo "Checking DESCRIPTION file format..."
          if [ -f "DESCRIPTION" ]; then
            if ! grep -q "^Package:" DESCRIPTION; then
              echo "❌ ERROR: DESCRIPTION missing 'Package:' field"
              STRUCTURE_ISSUES=$((STRUCTURE_ISSUES + 1))
            fi
            if ! grep -q "^Version:" DESCRIPTION; then
              echo "❌ ERROR: DESCRIPTION missing 'Version:' field"
              STRUCTURE_ISSUES=$((STRUCTURE_ISSUES + 1))
            fi
          fi

          echo ""
          if [ $STRUCTURE_ISSUES -eq 0 ]; then
            echo "✅ Package structure looks good"
          else
            echo "❌ Found $STRUCTURE_ISSUES structure issues"
          fi

          echo "structure_issues=$STRUCTURE_ISSUES" >> $GITHUB_OUTPUT

      # ==========================================
      # TESTTHAT TESTS
      # ==========================================

      - name: Run testthat tests
        id: testthat
        continue-on-error: true
        run: |
          echo "=== Running testthat tests ==="

          if [ ! -d "tests/testthat" ]; then
            echo "⚠️  No tests/testthat directory found"
            echo "test_status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          TEST_FILES=$(find tests/testthat -name "test*.R" | wc -l)
          echo "Found $TEST_FILES test file(s)"

          if [ $TEST_FILES -eq 0 ]; then
            echo "⚠️  No test files found in tests/testthat/"
            echo "test_status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          Rscript -e "
          library(testthat)

          tryCatch({
            if (requireNamespace('devtools', quietly = TRUE)) {
              devtools::load_all('.', quiet = TRUE)
              cat('✓ Package loaded with devtools\n')
            } else {
              cat('⚠️  devtools not available, loading R files directly\n')
              r_files <- list.files('R', pattern = '\\\\.R$', full.names = TRUE)
              lapply(r_files, source)
              cat('✓ Sourced', length(r_files), 'R file(s)\n')
            }
          }, error = function(e) {
            cat('⚠️  Warning: Could not load package:', conditionMessage(e), '\n')
          })

          cat('\nRunning tests...\n')
          results <- test_dir('tests/testthat', reporter = 'summary')

          if (any(results\$failed > 0)) {
            cat('\n❌ Some tests failed\n')
            quit(status = 1)
          } else if (any(results\$warning > 0)) {
            cat('\n⚠️  Tests passed with warnings\n')
            quit(status = 0)
          } else {
            cat('\n✅ All tests passed\n')
            quit(status = 0)
          }
          "

          TEST_EXIT_CODE=$?
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "test_status=passed" >> $GITHUB_OUTPUT
          else
            echo "test_status=failed" >> $GITHUB_OUTPUT
          fi

          exit $TEST_EXIT_CODE

      # ==========================================
      # DATA COMPARISON (vs main)
      # ==========================================

      - name: Get changed RDA files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            data/*.rda
            data/*.RData

      - name: List all data files
        id: all-data-files
        run: |
          ALL=$(find data -name "*.rda" -o -name "*.RData" 2>/dev/null | sort | tr '\n' ' ')
          echo "all_files=${ALL}" >> $GITHUB_OUTPUT

      - name: Compare data files
        if: steps.changed-files.outputs.any_changed == 'true'
        id: comparison
        continue-on-error: true
        run: |
          Rscript inst/scripts/compare_data_files.R "${{ steps.changed-files.outputs.all_changed_files }}"
          echo "comparison_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-comparison-report
          path: comparison_report.txt
          retention-days: 30

      - name: Check for approval override
        if: steps.comparison.outputs.comparison_exit_code != '0'
        id: check-approval
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const approved = labels.includes('data-changes-approved');

            console.log('PR labels:', labels);
            console.log('Has approval:', approved);

            core.setOutput('approved', approved);
            return approved;

      # ==========================================
      # QC LOG COMPARISON (vs main)
      # ==========================================
      # update-data.yml already ran data-raw/qc/run_annual_qc.R and
      # data-raw/data-checks/stream_team_review/render_reviews.R and
      # committed their outputs to this branch (unless update_type was
      # biweekly). This step doesn't re-render anything - it just diffs
      # this branch's committed data-raw/qc/qc_log_errors.csv against
      # main's copy, the same "compare against the other branch" pattern
      # as the .rda comparison above.
      #
      # The QC log is a running, human-annotated backlog, not a clean
      # pass/fail signal - qc_log_errors.csv already has open issues in it
      # on main today. So this only fails on error-level issues that are
      # OPEN on this branch but were NOT already open on main - i.e. new
      # issues this update introduced, not the pre-existing backlog (which
      # is still surfaced, just non-blocking, in the PR comment below).

      - name: Compare QC log against main
        if: steps.update-type.outputs.update_type != 'biweekly'
        id: qc-comparison
        continue-on-error: true
        run: |
          Rscript - <<'RSCRIPT'
          read_open_ids <- function(lines) {
            if (length(lines) == 0) return(character(0))
            con <- textConnection(lines)
            df <- tryCatch(
              readr::read_csv(con, show_col_types = FALSE,
                               col_types = readr::cols(.default = "c")),
              error = function(e) NULL
            )
            close(con)
            if (is.null(df) || nrow(df) == 0) return(character(0))
            df <- df[rowSums(!is.na(df)) > 0, ]
            if (nrow(df) == 0) return(character(0))
            df$log_id[df$status == "open"]
          }

          errors_path   <- "data-raw/qc/qc_log_errors.csv"
          warnings_path <- "data-raw/qc/qc_log_warnings.csv"

          this_branch_errors   <- if (file.exists(errors_path)) readLines(errors_path) else character(0)
          this_branch_warnings <- if (file.exists(warnings_path)) readLines(warnings_path) else character(0)

          main_errors <- suppressWarnings(
            system2("git", c("show", "main:data-raw/qc/qc_log_errors.csv"),
                    stdout = TRUE, stderr = FALSE)
          )
          main_status <- attr(main_errors, "status")
          if (!is.null(main_status) && main_status != 0) main_errors <- character(0)

          open_errors_this_branch <- read_open_ids(this_branch_errors)
          open_errors_main        <- read_open_ids(main_errors)
          open_warnings           <- read_open_ids(this_branch_warnings)

          new_open_errors <- setdiff(open_errors_this_branch, open_errors_main)

          gh_out <- Sys.getenv("GITHUB_OUTPUT")
          cat(sprintf("new_open_errors=%d\n",     length(new_open_errors)),        file = gh_out, append = TRUE)
          cat(sprintf("total_open_errors=%d\n",   length(open_errors_this_branch)), file = gh_out, append = TRUE)
          cat(sprintf("total_open_warnings=%d\n", length(open_warnings)),           file = gh_out, append = TRUE)

          cat(sprintf(
            "This branch open errors: %d | main open errors: %d | new vs main: %d\n",
            length(open_errors_this_branch), length(open_errors_main), length(new_open_errors)
          ))
          if (length(new_open_errors) > 0) {
            cat("\nOpen error log_ids on this branch not already open on main:\n")
            print(new_open_errors)
          }
          RSCRIPT

      # ==========================================
      # REPORTING
      # ==========================================

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const credentialIssues = parseInt('${{ steps.credential-check.outputs.credential_issues }}') || 0;
            const structureIssues = parseInt('${{ steps.structure-check.outputs.structure_issues }}') || 0;
            const testStatus = '${{ steps.testthat.outputs.test_status }}' || 'unknown';
            const comparisonExitCode = '${{ steps.comparison.outputs.comparison_exit_code }}';
            const dataApproved = '${{ steps.check-approval.outputs.approved }}' === 'true';
            const updateType = '${{ steps.update-type.outputs.update_type }}' || 'manual';
            const qcComparisonOutcome = '${{ steps.qc-comparison.outcome }}';
            const newOpenErrors = parseInt('${{ steps.qc-comparison.outputs.new_open_errors }}') || 0;
            const totalOpenErrors = parseInt('${{ steps.qc-comparison.outputs.total_open_errors }}') || 0;
            const totalOpenWarnings = parseInt('${{ steps.qc-comparison.outputs.total_open_warnings }}') || 0;

            let comparisonReport = 'No comparison report generated.';
            if (fs.existsSync('comparison_report.txt')) {
              comparisonReport = fs.readFileSync('comparison_report.txt', 'utf8');
            }

            let statusSummary = '## 🔍 Quality Check Summary\n\n';
            statusSummary += `_update-type: \`${updateType}\`_\n\n`;

            if (credentialIssues > 0) {
              statusSummary += '❌ **Credential Scan:** Found ' + credentialIssues + ' potential issue(s)\n';
            } else {
              statusSummary += '✅ **Credential Scan:** No credentials detected\n';
            }

            if (structureIssues > 0) {
              statusSummary += '❌ **Package Structure:** Found ' + structureIssues + ' issue(s)\n';
            } else {
              statusSummary += '✅ **Package Structure:** Valid R package structure\n';
            }

            if (testStatus === 'passed') {
              statusSummary += '✅ **Tests:** All tests passed\n';
            } else if (testStatus === 'failed') {
              statusSummary += '❌ **Tests:** Some tests failed\n';
            } else if (testStatus === 'skipped') {
              statusSummary += '⚠️ **Tests:** No tests found (skipped)\n';
            } else {
              statusSummary += '❓ **Tests:** Status unknown\n';
            }

            if (comparisonExitCode === '0') {
              statusSummary += '✅ **Data Comparison (vs main):** No existing values changed\n';
            } else if (dataApproved) {
              statusSummary += '⚠️ **Data Comparison (vs main):** Existing values changed — manually approved\n';
            } else {
              statusSummary += '❌ **Data Comparison (vs main):** Existing values changed (requires approval)\n';
            }

            if (updateType === 'biweekly') {
              statusSummary += '⏭️ **QC Log (vs main):** skipped (biweekly update)\n';
            } else if (qcComparisonOutcome === 'success' || qcComparisonOutcome === 'failure') {
              if (newOpenErrors > 0) {
                statusSummary += `❌ **QC Log (vs main):** ${newOpenErrors} new open error(s) not already open on main\n`;
              } else {
                statusSummary += '✅ **QC Log (vs main):** no new open errors vs main\n';
              }
              statusSummary += `   _(backlog: ${totalOpenErrors} open error(s), ${totalOpenWarnings} open warning(s) total on this branch — not blocking)_\n`;
            } else {
              statusSummary += '❓ **QC Log (vs main):** comparison did not run\n';
            }

            statusSummary += '\n---\n\n';

            let detailedReport = '';

            const allDataFiles = '${{ steps.all-data-files.outputs.all_files }}'.trim().split(/\s+/).filter(Boolean);
            const changedDataFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.trim().split(/\s+/).filter(Boolean);
            const unchangedDataFiles = allDataFiles.filter(f => !changedDataFiles.includes(f));

            let dataSection = '';

            if (comparisonExitCode !== '0') {
              let approvalNote = '';
              if (dataApproved) {
                approvalNote = '> ⚠️ **Existing values were changed — manually approved** via `data-changes-approved` label.';
              } else {
                approvalNote = `> ❌ **Existing values were changed and not yet approved.**\n>\n> To approve: review the per-file details below, then add the \`data-changes-approved\` label to this PR.`;
              }
              dataSection = `### 📊 Data File Comparison (vs main)\n\n${approvalNote}\n\n${comparisonReport}`;
            } else if (changedDataFiles.length > 0) {
              dataSection = `### 📊 Data File Comparison (vs main)\n\n${comparisonReport}`;
            }

            if (unchangedDataFiles.length > 0) {
              const unchangedList = unchangedDataFiles.map(f => `\`${f}\``).join(', ');
              dataSection += `\n\n**Not changed in this PR:** ${unchangedList}`;
            }

            if (dataSection) {
              detailedReport += dataSection + '\n\n---\n\n';
            }

            if (credentialIssues > 0) {
              detailedReport += `### 🔐 Credential Scan Issues

            Review the "Check for credentials" step to see what was detected.

            **How to fix:**
            - Remove sensitive files from the commit
            - Use environment variables: \`Sys.getenv("API_KEY")\`
            - Add sensitive files to \`.gitignore\`

            ---

            `;
            }

            if (structureIssues > 0) {
              detailedReport += `### 📦 Package Structure Issues

            Review the "Check R package structure" step in the workflow logs.

            **How to fix:**
            - Ensure standard R package structure
            - Run \`devtools::check()\` locally

            ---

            `;
            }

            if (testStatus === 'failed') {
              detailedReport += `### 🧪 Test Failures

            Review the "Run testthat tests" step in the workflow logs.

            **How to fix:**
            - Run tests locally: \`devtools::test()\`
            - Fix failing tests

            ---

            `;
            }

            if (updateType !== 'biweekly' && newOpenErrors > 0) {
              detailedReport += `### 🧬 New QC Issues vs main (\`data-raw/qc/qc_log_errors.csv\`)

            This branch has **${newOpenErrors} new** error-level issue(s) marked \`open\` that were not already open on main (on top of ${totalOpenErrors - newOpenErrors} pre-existing open error(s) already on this branch, which are not blocking this PR).

            These were rendered by update-data.yml's "Run annual QC + stream team review" step and already committed to this branch - check that workflow run's log for details on what triggered each one.

            **How to resolve:**
            - Open \`data-raw/qc/qc_log_errors.csv\` on this branch and find the rows with \`status = open\` that aren't open on main (see the workflow log above for their \`log_id\`s)
            - For each: set \`status\` to \`reviewed_no_issue\`, \`fixed_in_patch\` (and add a fix block to \`data-raw/qc/fixes/\`), or \`fixed_in_source\`, with \`reviewer_notes\` explaining the call
            - Commit the updated log to this branch and push - this check re-runs and only re-fails on issues still marked \`open\` and not open on main

            ---

            `;
            }

            const infoFooter = `
            <details>
            <summary>ℹ️ About these checks</summary>

            - **Credential Scan:** Prevents accidental commit of secrets
            - **Package Structure:** Ensures R package standards
            - **Tests:** Verifies code functionality
            - **Data Comparison (vs main):** Checks that existing values in .rda files are not changed unexpectedly compared to main; new rows are informational only
            - **QC Log (vs main):** Compares this branch's already-committed \`data-raw/qc/qc_log_errors.csv\` (rendered by update-data.yml) against main's copy; only fails on *newly* open error-level issues not already open on main (skipped entirely for biweekly updates)

            </details>`;

            const fullComment = statusSummary + detailedReport + infoFooter;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Quality Check Summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: fullComment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fullComment
              });
            }

      - name: Final status check
        if: always()
        run: |
          echo "=== Final Status Check ==="

          CREDENTIAL_ISSUES="${{ steps.credential-check.outputs.credential_issues }}"
          STRUCTURE_ISSUES="${{ steps.structure-check.outputs.structure_issues }}"
          TEST_STATUS="${{ steps.testthat.outputs.test_status }}"
          COMPARISON_EXIT="${{ steps.comparison.outputs.comparison_exit_code }}"
          DATA_APPROVED="${{ steps.check-approval.outputs.approved }}"
          UPDATE_TYPE="${{ steps.update-type.outputs.update_type }}"
          NEW_OPEN_ERRORS="${{ steps.qc-comparison.outputs.new_open_errors }}"

          if [ -z "$CREDENTIAL_ISSUES" ]; then CREDENTIAL_ISSUES=0; fi
          if [ -z "$STRUCTURE_ISSUES" ]; then STRUCTURE_ISSUES=0; fi
          if [ -z "$TEST_STATUS" ]; then TEST_STATUS=unknown; fi
          if [ -z "$COMPARISON_EXIT" ]; then COMPARISON_EXIT=0; fi
          if [ -z "$DATA_APPROVED" ]; then DATA_APPROVED=false; fi
          if [ -z "$NEW_OPEN_ERRORS" ]; then NEW_OPEN_ERRORS=0; fi

          echo "Credential issues: $CREDENTIAL_ISSUES"
          echo "Structure issues: $STRUCTURE_ISSUES"
          echo "Test status: $TEST_STATUS"
          echo "Comparison exit code: $COMPARISON_EXIT"
          echo "Data approved: $DATA_APPROVED"
          echo "Update type: $UPDATE_TYPE"
          echo "New open QC errors vs main: $NEW_OPEN_ERRORS"
          echo ""

          FAILURES=0

          if [ "$CREDENTIAL_ISSUES" != "0" ]; then
            echo "❌ Credential scan found issues"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$STRUCTURE_ISSUES" != "0" ]; then
            echo "❌ Package structure has issues"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$TEST_STATUS" = "failed" ]; then
            echo "❌ Tests failed"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$COMPARISON_EXIT" != "0" ] && [ "$DATA_APPROVED" != "true" ]; then
            echo "❌ Data comparison failed and not approved"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$UPDATE_TYPE" != "biweekly" ] && [ "$NEW_OPEN_ERRORS" != "0" ]; then
            echo "❌ QC log has $NEW_OPEN_ERRORS new open error(s) vs main - see data-raw/qc/qc_log_errors.csv"
            FAILURES=$((FAILURES + 1))
          fi

          echo ""
          if [ "$FAILURES" -eq 0 ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ $FAILURES check(s) failed"
            echo "Review the PR comment for details."
            exit 1
          fi
