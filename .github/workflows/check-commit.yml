name: "PR Data Update (check-commit -> update-data -> quality-checks)"

# Entry point for the MANUAL / human-authored path:
#   Any PR opened/updated against main
#     -> lint-commit-messages  (fail fast on bad Conventional Commits syntax)
#     -> update-data            (regenerate data objects + QC/review, push
#                                back to PR branch)
#     -> quality-checks          (test-data.yml, called directly - compares
#                                 the branch just committed above against
#                                 main; .rda files, QC log, tests, structure)
#
# All three run in ONE triggered workflow run, in that order, because
# quality-checks (`uses: ./.github/workflows/test-data.yml`) is a job here
# with `needs: [lint-commit-messages, update-data]` rather than its own
# separate `pull_request` trigger. It used to be the latter: update-data.yml
# pushing its commit back to this PR branch would fire a second `synchronize`
# event that test-data.yml's own path-filtered trigger picked up. That
# worked, but had two real costs: (1) that second event also re-triggered
# *this* workflow (lint + a redundant no-op update-data run), and (2) a push
# authored by the default GITHUB_TOKEN (which update-data.yml's commit step
# uses) can require a maintainer to click "Approve and run workflows" before
# a new triggered run starts, depending on repo/org Actions settings -
# which is exactly the "awaiting approval to repeat" friction that showed
# up in practice. Chaining quality-checks as a job instead of a second event
# avoids both: nothing new is triggered, so there's nothing to approve, and
# lint/update-data don't run a redundant second time.
#
# There used to be a `check-data:` job here calling
# `./.github/workflows/check-data.yml`, but that file never existed; it's
# removed rather than fixed, since quality-checks (test-data.yml) already
# covers the same ground.
#
# Release tagging + NEWS/article generation deliberately does NOT happen
# here - that's handled by release-and-news.yml once this PR is actually
# merged to main, so a version is only cut for code that's landed.
#
# Requires branch protection on `main` with "PR Data Update (check-commit ->
# update-data -> quality-checks) / quality-checks" (this workflow's name +
# the quality-checks job id - NOT the old "Data Quality and Package Checks /
# quality-checks" name from when test-data.yml ran as its own trigger) and,
# optionally, "lint-commit-messages" set as required status checks so this
# genuinely blocks the merge button rather than just informing.

on:
  pull_request:
    # TODO(SRJPE): test-github-actions is here temporarily so Erin can test
    # this workflow chain by opening a PR from testing_workflow into
    # test-github-actions - remove it once that testing is done, leaving
    # only [main].
    branches: [main, test-github-actions]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lint-commit-messages:
    runs-on: ubuntu-latest
    outputs:
      update_type: ${{ steps.lint.outputs.update_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lint last commit message + resolve update-type
        id: lint
        run: |
          chmod +x .github/scripts/lint_commit_messages.sh
          .github/scripts/lint_commit_messages.sh "${{ github.event.pull_request.head.sha }}"

  update-data:
    needs: lint-commit-messages
    uses: ./.github/workflows/update-data.yml
    with:
      update_type: ${{ needs.lint-commit-messages.outputs.update_type }}
      ref: ${{ github.head_ref }}
      commit_changes: true
    secrets: inherit

  quality-checks:
    needs: [lint-commit-messages, update-data]
    uses: ./.github/workflows/test-data.yml
    with:
      ref: ${{ github.head_ref }}
    secrets: inherit
