# inst/config/data_comparison_config.yml
# ============================================
# DATA FILE COMPARISON CONFIGURATION
# ============================================
# Define ID columns and allowed changes for each data file
#
# report_differences: controls whether inst/scripts/compare_data_files.R
# surfaces this file's value/row-level changes in the PR comparison report
# and lets them fail the check. Every file is still compared against main
# either way (nothing goes unchecked) - this only controls whether ordinary
# value changes are shown/failed on, versus compared silently.
#   true  -> weekly_*, *_model_years.rda, annual_adult.rda: these are the
#            tables stream teams actually review row-by-row, so real changes
#            should show up and block the PR.
#   false -> covariates, hatchery/genetics/detection reference tables, and
#            other raw pulled tables not listed above: these are expected to
#            change on every pull, so we don't want routine value churn
#            reported or failing the check. Structural problems (a column
#            disappearing, a load error, a data type change) still get
#            reported/failed regardless of this setting, since those mean
#            something broke rather than "the data updated."
# Defaults to false (via the `default:` entry below) for any file not
# listed here at all.

# Annual adult data
annual_adult.rda:
  id_columns:
    - year
    - stream
    - data_type
  allowed_to_change:
  date_columns:
  numeric_tolerance: 1
  check_attributes: true
  report_differences: true

